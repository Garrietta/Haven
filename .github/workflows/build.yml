name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # No setup-android step: ubuntu runners already ship the Android SDK
      # (ANDROID_HOME is preset). The setup-android action's license prompt
      # fails non-interactively ("7 of 8 SDK package licenses not accepted").
      - uses: gradle/actions/setup-gradle@v3
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: haven-debug
          path: app/build/outputs/apk/debug/app-debug.apk
