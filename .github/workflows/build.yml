name: Build

# Every pull request and every push to main is tested and rendered, and
# gets the signed release APK: the build that upgrades the installed app,
# so a change can be tried on the phone before it is merged. Pull requests
# from forks are tested but not signed; they never see the secrets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Test, render, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # The runner ships an Android SDK (ANDROID_HOME is preset) but not
      # always the newest platform. Install the two packages the build
      # compiles against; `yes` answers the license prompt, which is what
      # the setup-android action trips over when run non-interactively.
      # `|| true` because the step runs under pipefail and `yes` always
      # ends by being cut off.
      - name: Install SDK platform 37 and build-tools 36
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # The real app, rendered on the JVM with a demo home: what a visual
      # change looks like, attached to the run.
      - name: Render screenshots
        run: ./gradlew :app:recordRoborazziDebug --tests '*HavenScreenshotTest*'
      - uses: actions/upload-artifact@v4
        with:
          name: haven-screenshots
          path: app/build/outputs/roborazzi/*.png
          if-no-files-found: error

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: haven-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: haven-test-report
          path: app/build/reports/tests/

  release:
    name: Signed release APK
    # Signing needs the repository's secrets, so: main, a manual run, or
    # a pull request whose branch lives in this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK platform 37 and build-tools 36
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/haven-release-keystore.jks"
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/haven-release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: haven-release
          path: app/build/outputs/apk/release/app-release.apk
