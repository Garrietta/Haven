android.useAndroidX=true
kotlin.code.style=official
# Each library's R class holds only its own resources.
android.nonTransitiveRClass=true

# HavenApp.kt and Screens.kt are large Compose files; the Kotlin daemon
# gets its own heap so a full compile does not thrash the Gradle daemon's.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC

org.gradle.configuration-cache=true
org.gradle.caching=true
