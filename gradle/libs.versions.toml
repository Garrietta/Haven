[versions]
# Home screen widgets (Glance).
glance = "1.1.1"
# Toolchain. AGP 9 compiles Kotlin itself, so there is no kotlin-android
# plugin: only the Compose compiler plugin carries the Kotlin version.
agp = "9.3.1"
kotlin = "2.4.20"

# Compose. The BOM pins ui/foundation/animation; material3 is pinned on its
# own because the Expressive APIs Haven's theme is built on
# (MaterialExpressiveTheme, MotionScheme, MaterialShapes) ship in 1.5.
compose-bom = "2026.09.00"
material3 = "1.5.0-rc01"
graphics-shapes = "1.1.0"

# AndroidX
activity-compose = "1.11.0"
lifecycle-viewmodel-compose = "2.9.4"
core-ktx = "1.17.0"
core-splashscreen = "1.2.0"
# Media3 stays on the version the camera transports (HLS, RTSP) were tuned
# and device-verified against; bump it together with a camera test pass.
media3 = "1.6.1"

# Networking and data
okhttp = "4.12.0"
snakeyaml = "2.2"
# GetStream's maintained libwebrtc build (same org.webrtc.* API as
# upstream). org.webrtc:google-webrtc no longer resolves from Maven
# Central; if this fork stops resolving, the fallback is
# io.github.webrtc-sdk:android (same namespace).
webrtc = "1.3.10"

# Tests
junit = "4.13.2"
org-json = "20240303"
robolectric = "4.17"
roborazzi = "1.78.0"
androidx-test-core = "1.7.0"
androidx-test-ext-junit = "1.3.0"

[libraries]
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
compose-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle-viewmodel-compose" }
graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphics-shapes" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "core-splashscreen" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
# The ring-mqtt RTSP fallback for the Front Door panel: the only live
# transport left when the primary camera entity is down.
media3-exoplayer-rtsp = { group = "androidx.media3", name = "media3-exoplayer-rtsp", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyaml" }
webrtc = { group = "io.getstream", name = "stream-webrtc-android", version.ref = "webrtc" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "org-json" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
